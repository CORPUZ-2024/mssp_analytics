<text x="98.0" y="184.0" class="lbl" text-anchor="start">python -m src.build_site [--check-only] [--offline]</text>
<text x="348.0" y="238.0" class="lbl" text-anchor="start">main(argv) → build(check_only, offline)</text>
<text x="314.0" y="264.0" class="lbl" text-anchor="start">CMSCatalog.load(allow_network = not offline)</text>
<text x="528.0" y="328.0" class="lbl" text-anchor="start">GET /data.json  (DCAT catalog)</text>
<text x="967.0" y="364.0" class="lbl" text-anchor="end">dataset distributions by title</text>
<text x="562.0" y="418.0" class="lbl" text-anchor="start">save(data/cms_catalog.json)</text>
<text x="562.0" y="488.0" class="lbl" text-anchor="start">from_cache(data/cms_catalog.json)</text>
<text x="512.0" y="520.0" class="lbl" text-anchor="end">catalog  (source = &quot;live&quot; | &quot;cache&quot;)</text>
<text x="348.0" y="574.0" class="lbl" text-anchor="start">resolve_plan(catalog)</text>
<text x="348.0" y="587.0" class="lbl" text-anchor="start">latest_years(2) · cuts_for_year(latest)</text>
<text x="314.0" y="613.0" class="lbl" text-anchor="start">extract(): fetch_vintages(catalog, FINAL years, required=True)</text>
<text x="737.0" y="677.0" class="lbl" text-anchor="end">vintage(year, cut)</text>
<text x="528.0" y="713.0" class="lbl" text-anchor="start">Vintage(dataset_id, api_url, …)</text>
<text x="753.0" y="749.0" class="lbl" text-anchor="start">GET /data-api/v1/dataset/{uuid}/data?size&amp;offset  (paged)</text>
<text x="967.0" y="785.0" class="lbl" text-anchor="end">rows</text>
<text x="787.0" y="839.0" class="lbl" text-anchor="start">_assert_expected_year() · _reshape_wide_to_long()</text>
<text x="737.0" y="871.0" class="lbl" text-anchor="end">final_raw  (+ oc_raw: optional OC cuts, required=False)</text>
<text x="314.0" y="907.0" class="lbl" text-anchor="start">transform(raw): process_dataframe(raw) → enrich(df)</text>
<text x="1177.0" y="943.0" class="lbl" text-anchor="end">normalised frames</text>
<text x="348.0" y="997.0" class="lbl" text-anchor="start">add_yoy_columns · add_confound_flags · add_oc_delta</text>
<text x="348.0" y="1010.0" class="lbl" text-anchor="start">build_county_payload(latest_df)</text>
<text x="348.0" y="1054.0" class="lbl" text-anchor="start">run_quality_gates(county_payload, latest_df)</text>
<text x="292.0" y="1108.0" class="lbl" text-anchor="end">raise BuildError — docs/data/ left untouched, exit 1</text>
<text x="348.0" y="1172.0" class="lbl" text-anchor="start">build_oc_stability(oc_df, latest_df)</text>
<text x="314.0" y="1198.0" class="lbl" text-anchor="start">build_reference_payload(): build_enrollment_type_skew_summary(),</text>
<text x="314.0" y="1220.0" class="lbl" text-anchor="start">build_pa_metrics_report(), build_cms_field_table(), TRACK_PARAMS, HCC_V28_DELTA</text>
<text x="1387.0" y="1240.0" class="lbl" text-anchor="end">reference tables</text>
<text x="348.0" y="1294.0" class="lbl" text-anchor="start">manifest = {built_at, catalog_source, latest_year, vintages, …}</text>
<text x="292.0" y="1348.0" class="lbl" text-anchor="end">return manifest  (nothing written)</text>
<text x="314.0" y="1394.0" class="lbl" text-anchor="start">_write() 4 JSON files to temp staging  →  publish(staging, docs/data)</text>
<text x="314.0" y="1414.0" class="lbl" text-anchor="start">atomic swap: old payload moved to docs/data.prev, restored if the copy fails, then removed</text>
<text x="292.0" y="1458.0" class="lbl" text-anchor="end">exit 0 · log summary</text>
<path class="note" d="M30,1510 h404.0 l10,10 v60 h-414.0 z"/><path class="note" d="M434.0,1510 v10 h10"/><text x="40.0" y="1528.0" class="notetxt" text-anchor="start">Then, by hand: git add docs/data data/cms_catalog.json,</text><text x="40.0" y="1542.0" class="notetxt" text-anchor="start">git commit, git push origin main (then bring master in line).</text><text x="40.0" y="1556.0" class="notetxt" text-anchor="start">The push touches docs/**, so .github/workflows/pages.yml verifies</text><text x="40.0" y="1570.0" class="notetxt" text-anchor="start">and deploys the new payload. No workflow runs this build.</text>
