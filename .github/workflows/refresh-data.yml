# Rebuild the committed dashboard payload from the CMS Data API.
#
# This is the only place in the project that talks to data.cms.gov. If CMS
# rotates a dataset UUID, changes the schema, or goes down, this job fails and
# opens an issue -- the published page keeps serving the payload already in
# docs/data/ and never shows a stack trace to a reader.
name: Refresh CMS data

on:
  schedule:
    # Weekly. CMS republishes this PUF a few times a year, so this is about
    # noticing a change quickly, not about keeping up with a fast feed.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Validate the upstream data without publishing"
        type: boolean
        default: false
  push:
    branches: [master, main]
    paths:
      # Rebuild when the ETL that shapes the payload changes, so docs/data and
      # the code that produced it never drift apart.
      - "src/etl/**"
      - "src/build_site.py"
      - "src/modules/**"
      - "disclosures_metrics.csv"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-cms-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Build payload
        id: build
        run: |
          if [ "${{ inputs.check_only }}" = "true" ]; then
            python -m src.build_site --check-only --verbose
          else
            python -m src.build_site --verbose
          fi

      - name: Summarise build
        if: success() && inputs.check_only != true
        run: |
          {
            echo "### CMS payload refreshed"
            echo ""
            echo '```json'
            cat docs/data/manifest.json | python -m json.tool
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit payload if it changed
        if: success() && inputs.check_only != true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/cms_catalog.json
          if git diff --cached --quiet; then
            echo "No change in the CMS payload; nothing to commit."
            exit 0
          fi
          YEAR=$(python -c "import json;print(json.load(open('docs/data/manifest.json'))['latest_year'])")
          git commit -m "Refresh CMS payload (PY${YEAR})"
          git push

      # A silent stale dashboard is the failure mode worth guarding against:
      # the page still renders, so nobody notices the data stopped moving.
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "CMS data refresh failed";
            const body = [
              "The scheduled CMS refresh failed, so `docs/data/` was left untouched",
              "and the published dashboard is serving the previous payload.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Usual causes, in order of likelihood:",
              "1. CMS retired or re-pointed a dataset UUID — the resolver in",
              "   `src/etl/catalog.py` should absorb this; check whether the dataset",
              "   title on data.cms.gov changed.",
              "2. A quality gate in `src/build_site.py` tripped (row count, state count,",
              "   null share, YoY coverage).",
              "3. CMS returned a different performance year than the catalog advertised —",
              "   the year assertion in `src/etl/client.py` catches this.",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "data-refresh",
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["data-refresh"],
              });
            }
