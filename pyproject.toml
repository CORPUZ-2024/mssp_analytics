[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mssp_analytics"
version = "0.1.0"
description = "MSSP county-level analytics ETL, validation, and module scaffolding for RADV, shared savings, PA simulation, and FHIR mapping."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.1",
  "pyyaml>=6.0",
  "requests>=2.31",
  "streamlit>=1.12.0",
  "plotly>=5.0",
  "openpyxl>=3.1"
]

[project.scripts]
mssp-etl = "src.cli:main"
